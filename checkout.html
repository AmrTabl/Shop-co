<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | SHOP.CO</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- ================================
     TOP BANNER
================================= -->

<div class="top-banner">

    Sign up and get 20% off to your first order.

    <a href="signup.html">
        Sign Up Now
    </a>

</div>


<!-- ================================
     NAVBAR
================================= -->

<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        SHOP.CO
    </a>


    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="category.html">
            Shop
        </a>

        <a href="index.html#new-arrivals">
            New Arrivals
        </a>

    </nav>


    <div class="nav-actions">

        <a
            href="cart.html"
            class="nav-icon"
        >
            🛒
        </a>

        <a
            href="signin.html"
            class="nav-icon"
        >
            👤
        </a>

    </div>

</header>



<!-- ================================
     CHECKOUT
================================= -->

<main class="checkout-page">


    <h1>
        CHECKOUT
    </h1>


    <div class="checkout-container">


        <!-- ============================
             CUSTOMER INFORMATION
        ============================= -->

        <section class="checkout-form">

            <h2>
                Billing Details
            </h2>


            <form id="checkout-form">


                <div class="checkout-field">

                    <label for="checkout-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="checkout-name"
                        placeholder="Your full name"
                        required
                    >

                </div>


                <div class="checkout-field">

                    <label for="checkout-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="checkout-email"
                        placeholder="name@example.com"
                        required
                    >

                </div>


                <div class="checkout-field">

                    <label for="checkout-phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="checkout-phone"
                        placeholder="01xxxxxxxxx"
                        required
                    >

                </div>


                <div class="checkout-field">

                    <label for="checkout-address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="checkout-address"
                        placeholder="Your address"
                        required
                    >

                </div>


                <div class="checkout-row">

                    <div class="checkout-field">

                        <label for="checkout-city">
                            City
                        </label>

                        <input
                            type="text"
                            id="checkout-city"
                            placeholder="City"
                            required
                        >

                    </div>


                    <div class="checkout-field">

                        <label for="checkout-country">
                            Country
                        </label>

                        <input
                            type="text"
                            id="checkout-country"
                            value="Egypt"
                            required
                        >

                    </div>

                </div>


                <h2 class="payment-title">
                    Payment Method
                </h2>


                <div class="payment-method">

                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="cash"
                            checked
                        >

                        Cash on Delivery

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="card"
                        >

                        Credit / Debit Card

                    </label>

                </div>


                <button
                    type="submit"
                    class="place-order-button"
                >
                    Place Order
                </button>


            </form>

        </section>



        <!-- ============================
             ORDER SUMMARY
        ============================= -->

        <section class="order-summary">

            <h2>
                Your Order
            </h2>


            <div id="checkout-items">

                <!-- Products generated by JavaScript -->

            </div>


            <div class="checkout-summary-line">

                <span>
                    Subtotal
                </span>

                <span id="checkout-subtotal">
                    $0
                </span>

            </div>


            <div class="checkout-summary-line">

                <span>
                    Shipping
                </span>

                <span id="checkout-shipping">
                    $10
                </span>

            </div>


            <div class="checkout-summary-line checkout-total">

                <span>
                    Total
                </span>

                <span id="checkout-total">
                    $0
                </span>

            </div>

        </section>


    </div>


    <!-- ================================
         SUCCESS MESSAGE
    ================================= -->

    <div
        id="checkout-success"
        class="checkout-success"
    >

        <h2>
            Order Placed Successfully!
        </h2>

        <p>
            Thank you for shopping with SHOP.CO.
        </p>

        <a href="index.html">
            Continue Shopping
        </a>

    </div>


</main>


<script src="js/ui.js"></script>
<script src="js/checkout.js"></script>

</body>

</html>
